<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alisha ❤️ Rajinder</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#0d0d0d;
  color:white;
  overflow-x:hidden;
}

/* ENTRY */
#entryScreen{
  position:fixed;
  width:100%;
  height:100%;
  background:#0d0d0d;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#entryScreen h1{
  font-family:'Playfair Display';
  color:#d4af37;
}

.enter-btn{
  margin-top:20px;
  padding:12px 30px;
  border:none;
  border-radius:30px;
  background:#d4af37;
  color:black;
}

/* MAIN */
#mainContent{display:none;}

.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.9)),
  url('https://images.unsplash.com/photo-1519741497674-611481863552');
  background-size:cover;
  color:white;
}

.hero h1{
  font-family:'Playfair Display';
  color:#d4af37;
}

/* COUPLE */
.couple-img{
  width:120px;
  animation:zoomWalk 4s ease forwards;
}

@keyframes zoomWalk{
  0%{transform:scale(0.3);opacity:0;}
  30%{transform:scale(0.8);opacity:1;}
  60%{transform:scale(1.5);}
  100%{transform:scale(3);opacity:0;}
}

.section{
  padding:30px;
  text-align:center;
}

.card{
  background:#1a1a1a;
  padding:20px;
  border-radius:15px;
  border:1px solid #d4af37;
  max-width:90%;
  margin:auto;
}

.timer{
  font-size:1.4rem;
  color:#d4af37;
}

/* PARTICLES */
.petal{
  position:fixed;
  width:6px;
  height:6px;
  background:#d4af37;
  border-radius:50%;
  top:-10px;
  animation:fall linear infinite;
}

@keyframes fall{
  to{transform:translateY(100vh);}
}
</style>
</head>

<body>

<!-- ENTRY -->
<div id="entryScreen">
  <h1>Alisha ❤️ Rajinder</h1>
  <p>Ring Ceremony</p>
  <button class="enter-btn" onclick="enterSite()">💍 Save the Date</button>
</div>

<!-- MAIN -->
<div id="mainContent">

<div class="hero">
  <h1>Alisha ❤️ Rajinder</h1>
  <img src="https://i.ibb.co/7QpKsCX/couple.png" class="couple-img">
  <p>18 April 2026 | 7 PM onwards</p>
</div>

<div class="section">
  <div class="timer" id="countdown"></div>
</div>

<div class="section">
  <div class="card">
    <h2 style="color:#d4af37;">Venue</h2>
    <p>Best Western Merrion</p>
    <p>Allure Banquet</p>
    <p>B Block, Ranjit Avenue, Amritsar</p>
    <a href="https://maps.app.goo.gl/VxLi1LGfHG9u6B4W6?g_st=aw" style="color:#d4af37;">View Map</a>
  </div>
</div>

</div>

<!-- YOUR OWN MUSIC -->
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
function enterSite(){
  document.getElementById("entryScreen").style.display="none";
  document.getElementById("mainContent").style.display="block";

  const music=document.getElementById("bgMusic");
  music.play();
}

// countdown
const eventDate=new Date("April 18, 2026 19:00:00").getTime();
setInterval(()=>{
  const now=new Date().getTime();
  const gap=eventDate-now;

  const d=Math.floor(gap/(1000*60*60*24));
  const h=Math.floor((gap%(1000*60*60*24))/(1000*60*60));
  const m=Math.floor((gap%(1000*60*60))/(1000*60));
  const s=Math.floor((gap%(1000*60))/1000);

  document.getElementById("countdown").innerHTML=
  d+"d "+h+"h "+m+"m "+s+"s";
},1000);

// particles
setInterval(()=>{
  const p=document.createElement("div");
  p.className="petal";
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(Math.random()*3+2)+"s";
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),5000);
},300);
</script>

</body>
</html>
