<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alisha 💗 Rajinder</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
html,body{
  margin:0;
  padding:0;
  overflow-x:hidden;
  scroll-behavior:smooth;
  font-family:'Poppins',sans-serif;
}

/* ===== ENTRY SCREEN ===== */
#entryScreen{
  position:fixed;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:white;
  z-index:9999;
}

#entryScreen::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:url('bg.jpg') center/cover no-repeat;
  animation:zoomBg 8s ease forwards;
  z-index:-2;
}

#entryScreen::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  z-index:-1;
}

@keyframes zoomBg{
  to{transform:scale(1.2);}
}

.save-text{
  font-family:'Playfair Display';
  font-size:2.5rem;
  text-shadow:0 0 20px pink;
}

.enter-btn{
  margin-top:20px;
  padding:12px 30px;
  border:none;
  border-radius:30px;
  background:#ffc0cb;
  font-weight:bold;
}

/* ===== MAIN ===== */
#mainContent{
  display:none;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  color:white;
  position:relative;
}

.hero::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:url('bg.jpg') center/cover no-repeat;
  z-index:-2;
}

.hero::after{
  content:"";
  position:absolute;
  bottom:0;
  width:100%;
  height:65%;
  background:url('bg.jpg') center/cover no-repeat;
  filter:blur(8px);
  z-index:-1;
}

.hero h1{
  font-family:'Playfair Display';
  color:#ffd1dc;
  text-shadow:0 0 20px pink;
}

/* SCROLL BUTTON */
.scroll-down{
  position:absolute;
  bottom:80px;
  cursor:pointer;
}

.scroll-btn{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#ffc0cb;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:20px;
  animation:bounce 1.5s infinite;
}

@keyframes bounce{
  50%{transform:translateY(10px);}
}

/* SECTION */
.section{
  padding:50px 20px;
  text-align:center;
}

/* GALLERY */
.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.gallery img{
  width:100%;
  border-radius:15px;
}

/* ===== VENUE (YOUR FAVORITE STYLE) ===== */
.venue-section{
  padding:60px 20px;
  text-align:center;
}

.venue-title{
  color:#e6a4b4;
  font-size:2rem;
  margin-bottom:30px;
}

/* CARD */
.venue-card{
  position:relative;
  background:linear-gradient(135deg,#fff0f5,#ffe4ec);
  border-radius:25px;
  padding:30px 20px;
  max-width:320px;
  margin:auto;

  box-shadow:
    0 10px 30px rgba(255,182,193,0.3),
    inset 0 0 20px rgba(255,255,255,0.6);

  overflow:hidden;
}

/* GLOW */
.venue-glow{
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:conic-gradient(
    transparent,
    rgba(255,182,193,0.6),
    transparent 30%
  );
  animation:rotateGlow 6s linear infinite;
}

@keyframes rotateGlow{
  100%{transform:rotate(360deg);}
}

.venue-card h3,
.venue-card p{
  position:relative;
  z-index:1;
}

/* BUTTON */
.map-btn{
  display:inline-block;
  margin-top:20px;
  padding:12px 25px;
  border-radius:30px;

  background:linear-gradient(45deg,#ff9ecb,#ffc1da);
  color:white;
  text-decoration:none;
  font-weight:600;

  box-shadow:0 5px 15px rgba(255,105,180,0.4);
  transition:0.3s;
  position:relative;
  z-index:1;
}

.map-btn:hover{
  transform:scale(1.1) translateY(-3px);
}

.map-btn::after{
  content:" →";
  animation:ride 1s infinite alternate;
}

@keyframes ride{
  from{transform:translateX(0);}
  to{transform:translateX(6px);}
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
}

/* BUTTERFLIES (light, not heavy) */
.butterfly{
  position:absolute;
  width:18px;
  height:18px;
  background:url('butterfly.png') center/contain no-repeat;
  animation:wing 0.2s infinite alternate;
  opacity:0.4;
}

@keyframes wing{
  from{transform:scaleX(1);}
  to{transform:scaleX(0.6);}
}
</style>
</head>

<body>

<!-- ENTRY -->
<div id="entryScreen">
  <div class="save-text">Save the Date</div>
  <button class="enter-btn" onclick="enterSite()">Enter</button>
</div>

<!-- MAIN -->
<div id="mainContent">

<div class="hero" id="hero">
  <h1>Alisha 💗 Rajinder</h1>
  <p>18 April 2026 | 7 PM onwards</p>
  <div id="countdown"></div>

  <div class="scroll-down" onclick="scrollToSection()">
    <div class="scroll-btn">↓</div>
  </div>
</div>

<div class="section" id="nextSection">
  <h2 style="color:#e6a4b4;">Our Moments 💗</h2>
  <div class="gallery">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
  </div>
</div>

<!-- VENUE -->
<div class="venue-section">
  <h2 class="venue-title">Venue</h2>

  <div class="venue-card">
    <div class="venue-glow"></div>

    <h3>Best Western Merrion</h3>
    <p>Allure Banquet</p>
    <p>B Block, Ranjit Avenue, Amritsar</p>

    <a href="https://maps.app.goo.gl/VxLi1LGfHG9u6B4W6?g_st=aw" target="_blank" class="map-btn">
      🎢 Ride to Venue
    </a>
  </div>
</div>

<footer>
  Made with ❤️ for Alisha & Rajinder
</footer>

</div>

<!-- MUSIC -->
<audio id="bgMusic" loop>
  <source src="music.mp3">
</audio>

<script>
function enterSite(){
  document.getElementById("entryScreen").style.display="none";
  document.getElementById("mainContent").style.display="block";

  document.getElementById("bgMusic").play();
  generateButterflies();
}

/* FIXED BUTTERFLIES (no layout shift) */
function generateButterflies(){
  const hero=document.getElementById("hero");

  for(let i=0;i<20;i++){
    const b=document.createElement("div");
    b.className="butterfly";

    b.style.left=Math.random()*100+"%";
    b.style.top=Math.random()*100+"%";

    b.animate([
      {transform:"translate(0,0)"},
      {transform:"translate(80px,-60px)"},
      {transform:"translate(120px,120px)"}
    ],{
      duration:5000+Math.random()*2000,
      iterations:Infinity
    });

    hero.appendChild(b);
  }
}

function scrollToSection(){
  document.getElementById("nextSection").scrollIntoView({behavior:"smooth"});
}

/* TIMER */
const eventDate=new Date("April 18, 2026 19:00:00").getTime();

setInterval(()=>{
  const now=new Date().getTime();
  const gap=eventDate-now;

  const d=Math.floor(gap/(1000*60*60*24));
  const h=Math.floor((gap%(1000*60*60*24))/(1000*60*60));
  const m=Math.floor((gap%(1000*60*60))/(1000*60));
  const s=Math.floor((gap%(1000*60))/1000);

  document.getElementById("countdown").innerHTML=
  d+"d "+h+"h "+m+"m "+s+"s";
},1000);
</script>

</body>
</html>
