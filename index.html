<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alisha 💗 Rajinder</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  overflow-x:hidden;
}

/* ENTRY */
#entryScreen{
  position:fixed;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:white;
  z-index:9999;
}

#entryScreen::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:url('bg.jpg') center/cover no-repeat;
  z-index:-2;
}

#entryScreen::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  z-index:-1;
}

.save-text{
  font-family:'Playfair Display';
  font-size:2.5rem;
  text-shadow:0 0 20px pink;
}

.enter-btn{
  margin-top:20px;
  padding:12px 30px;
  border:none;
  border-radius:30px;
  background:#ffc0cb;
}

/* MAIN */
#mainContent{ display:none; }

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  color:white;
  position:relative;
  overflow:hidden;
}

.hero::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:url('bg.jpg') center/cover no-repeat;
  z-index:-2;
}

.hero::after{
  content:"";
  position:absolute;
  bottom:0;
  width:100%;
  height:65%;
  background:url('bg.jpg') center/cover no-repeat;
  filter:blur(8px);
  z-index:-1;
}

.hero h1{
  font-family:'Playfair Display';
  color:#ffd1dc;
  text-shadow:0 0 20px pink;
}

/* SCROLL */
.scroll-down{
  position:absolute;
  bottom:80px;
  cursor:pointer;
}

.scroll-btn{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#ffc0cb;
  display:flex;
  justify-content:center;
  align-items:center;
  animation:bounce 1.5s infinite;
}

@keyframes bounce{
  50%{transform:translateY(10px);}
}

/* SECTION (FIXED SPACING) */
.section{
  padding:30px 20px 10px;
  text-align:center;
}

.section h2{
  margin-bottom:15px;
}

/* GALLERY */
.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:0;
}

.gallery img{
  width:100%;
  border-radius:15px;
}

/* VENUE (FIXED GAP) */
.venue-section{
  padding:30px 20px;
  text-align:left;
}

.venue-title{
  color:#e6a4b4;
  font-size:2rem;
  margin-left:10px;
  margin-top:0;
}

/* CARD */
.venue-card{
  position:relative;
  background:#fff0f5;
  border-radius:25px;
  padding:30px 20px;
  max-width:320px;
  margin-left:10px;
  overflow:hidden;
}

/* BORDER */
.venue-card::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:25px;
  background:conic-gradient(#ffb6c1,#ffc0cb,#ff69b4,#ffc0cb,#ffb6c1);
  animation:rotateBorder 5s linear infinite;
  z-index:-1;
}

.venue-card::after{
  content:"";
  position:absolute;
  inset:3px;
  background:#fff0f5;
  border-radius:20px;
  z-index:-1;
}

@keyframes rotateBorder{
  100%{transform:rotate(360deg);}
}

.map-btn{
  display:inline-block;
  margin-top:20px;
  padding:12px 25px;
  border-radius:30px;
  background:linear-gradient(45deg,#ff9ecb,#ffc1da);
  color:white;
  text-decoration:none;
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
}

/* BUTTERFLY */
.butterfly{
  position:absolute;
  background:url('butterfly.png') center/contain no-repeat;
  pointer-events:none;
  animation:wing 0.25s infinite alternate;
}

@keyframes wing{
  from{transform:scaleX(1);}
  to{transform:scaleX(0.6);}
}
</style>
</head>

<body>

<!-- ENTRY -->
<div id="entryScreen">
  <div class="save-text">Save the Date</div>
  <button class="enter-btn" onclick="enterSite()">Enter</button>
</div>

<!-- MAIN -->
<div id="mainContent">

<div class="hero" id="hero">
  <h1>Alisha 💗 Rajinder</h1>
  <p>18 April 2026 | 7 PM onwards</p>
  <div id="countdown"></div>

  <div class="scroll-down" onclick="scrollToSection()">
    <div class="scroll-btn">↓</div>
  </div>
</div>

<div class="section" id="nextSection">
  <h2 style="color:#e6a4b4;">Our Moments 💗</h2>

  <div class="gallery">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
  </div>
</div>

<div class="venue-section">
  <h2 class="venue-title">Venue</h2>

  <div class="venue-card">
    <h3>Best Western Merrion</h3>
    <p>Allure Banquet</p>
    <p>B Block, Ranjit Avenue, Amritsar</p>

    <a href="https://maps.app.goo.gl/VxLi1LGfHG9u6B4W6?g_st=aw" target="_blank" class="map-btn">
      🎢 Ride to Venue
    </a>
  </div>
</div>

<footer>
  Made with ❤️ for Alisha & Rajinder
</footer>

</div>

<!-- MUSIC -->
<audio id="bgMusic" loop>
  <source src="music.mp3">
</audio>

<script>
function enterSite(){
  document.getElementById("entryScreen").style.display="none";
  document.getElementById("mainContent").style.display="block";

  document.getElementById("bgMusic").play();
  generateButterflies();
}

function generateButterflies(){
  const hero = document.getElementById("hero");

  for(let i=0;i<70;i++){
    const b = document.createElement("div");
    b.className="butterfly";

    const size = 14 + Math.random()*10;
    b.style.width = size+"px";
    b.style.height = size+"px";

    b.style.opacity = 0.3 + Math.random()*0.4;

    b.style.left = (i<35) ? "-30px" : "100%";
    b.style.top = Math.random()*80 + "%";

    b.animate([
      { transform:"translate(0,0)" },
      { transform:`translate(${(Math.random()*200 - 100)}px, -60px)` },
      { transform:`translate(${(Math.random()*200 - 100)}px, 200px)` }
    ],{
      duration:5000 + Math.random()*3000,
      iterations:Infinity
    });

    hero.appendChild(b);
  }
}

function scrollToSection(){
  document.getElementById("nextSection").scrollIntoView({
    behavior:"smooth"
  });
}

const eventDate=new Date("April 18, 2026 19:00:00").getTime();

setInterval(()=>{
  const now=new Date().getTime();
  const gap=eventDate-now;

  const d=Math.floor(gap/(1000*60*60*24));
  const h=Math.floor((gap%(1000*60*60*24))/(1000*60*60));
  const m=Math.floor((gap%(1000*60*60))/(1000*60));
  const s=Math.floor((gap%(1000*60))/1000);

  document.getElementById("countdown").innerHTML=
  d+"d "+h+"h "+m+"m "+s+"s";

},1000);
</script>

</body>
</html>
