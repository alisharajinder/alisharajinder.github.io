<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alisha 💗 Rajinder</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#fff5f7;
  overflow-x:hidden;
}

/* ENTRY */
#entryScreen{
  position:fixed;
  width:100%;
  height:100%;
  background:#fff5f7;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#entryScreen h1{
  font-family:'Playfair Display';
  color:#e6a4b4;
  text-shadow:0 0 15px rgba(230,164,180,0.9);
}

.enter-btn{
  margin-top:20px;
  padding:12px 30px;
  border:none;
  border-radius:30px;
  background:#f3c5cf;
}

/* HERO */
.hero{
  height:100vh;
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;
  overflow:hidden;
}

/* CLEAR FULL IMAGE */
.hero::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:url('bg.jpg') center/cover no-repeat;
  z-index:-2;
}

/* BLUR BOTTOM 65% */
.hero::after{
  content:"";
  position:absolute;
  bottom:0;
  width:100%;
  height:65%;
  background:url('bg.jpg') center/cover no-repeat;
  filter:blur(8px);
  z-index:-1;
  opacity:0.95;

  /* smooth fade */
  mask-image: linear-gradient(to top, black 70%, transparent 100%);
  -webkit-mask-image: linear-gradient(to top, black 70%, transparent 100%);
}

/* TEXT */
.hero h1{
  font-family:'Playfair Display';
  font-size:2.5rem;
  color:#ffd1dc;
  text-shadow:0 0 20px rgba(255,182,193,1);
}

.hero p{
  margin-top:10px;
}

/* TIMER */
.timer{
  margin-top:15px;
  font-size:1.2rem;
}

/* SCROLL */
.scroll-down{
  position:absolute;
  bottom:20px;
  animation:bounce 1.5s infinite;
}

@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(10px);}
}

/* SECTION */
.section{
  padding:40px 20px;
  text-align:center;
}

/* GALLERY */
.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:20px;
}

.gallery img{
  width:100%;
  border-radius:15px;
}

/* CARD */
.card{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
  font-size:0.8rem;
  color:#777;
}
</style>
</head>

<body>

<!-- ENTRY -->
<div id="entryScreen">
  <h1>Alisha 💗 Rajinder</h1>
  <button class="enter-btn" onclick="enterSite()">💍 Save the Date</button>
</div>

<!-- MAIN -->
<div id="mainContent" style="display:none;">

<div class="hero">
  <h1>Alisha 💗 Rajinder</h1>
  <p>18 April 2026 | 7 PM onwards</p>
  <div class="timer" id="countdown"></div>
  <div class="scroll-down">⬇ Scroll Down ⬇</div>
</div>

<!-- COUPLE -->
<div class="section">
  <h2 style="color:#e6a4b4;">Our Moments 💗</h2>
  <div class="gallery">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
  </div>
</div>

<!-- VENUE -->
<div class="section">
  <div class="card">
    <h2 style="color:#e6a4b4;">Venue</h2>
    <p><b>Best Western Merrion</b></p>
    <p>Allure Banquet</p>
    <p>B Block, Ranjit Avenue, Amritsar</p>
    <a href="https://maps.app.goo.gl/VxLi1LGfHG9u6B4W6?g_st=aw">View Map</a>
  </div>
</div>

<footer>
  Made with ❤️ for Alisha & Rajinder
</footer>

</div>

<!-- MUSIC -->
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
function enterSite(){
  document.getElementById("entryScreen").style.display="none";
  document.getElementById("mainContent").style.display="block";

  const music=document.getElementById("bgMusic");

  document.body.addEventListener("click",function playOnce(){
    music.play();
    document.body.removeEventListener("click",playOnce);
  });
}

// TIMER
const eventDate=new Date("April 18, 2026 19:00:00").getTime();

setInterval(()=>{
  const now=new Date().getTime();
  const gap=eventDate-now;

  const d=Math.floor(gap/(1000*60*60*24));
  const h=Math.floor((gap%(1000*60*60*24))/(1000*60*60));
  const m=Math.floor((gap%(1000*60*60))/(1000*60));
  const s=Math.floor((gap%(1000*60))/1000);

  document.getElementById("countdown").innerHTML=
  d+"d "+h+"h "+m+"m "+s+"s";
},1000);
</script>

</body>
</html>
