<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alisha & Rajinder</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(to bottom,#fff5f7,#fdfaf6);
  color:#333;
  overflow-x:hidden;
}

/* ENTRY */
#entryScreen{
  position:fixed;
  width:100%;
  height:100%;
  background:linear-gradient(to bottom,#fff5f7,#fdfaf6);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
  text-align:center;
}

#entryScreen h1{
  font-family:'Playfair Display';
  color:#e6a4b4;
  font-size:2rem;
  text-shadow:0 0 12px rgba(230,164,180,0.8);
}

.enter-btn{
  margin-top:20px;
  padding:12px 35px;
  border:none;
  border-radius:30px;
  background:linear-gradient(45deg,#f8d7da,#f3c5cf);
  color:#333;
  font-weight:bold;
  box-shadow:0 0 15px rgba(230,164,180,0.4);
}

/* MAIN */
#mainContent{
  display:none;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
  background:linear-gradient(rgba(255,255,255,0.6),rgba(255,255,255,0.8)),
  url('https://images.unsplash.com/photo-1519741497674-611481863552');
  background-size:cover;
  background-position:center;
}

.hero h1{
  font-family:'Playfair Display';
  font-size:2.4rem;
  color:#e6a4b4;
  text-shadow:0 0 15px rgba(230,164,180,0.9);
}

.hero p{
  margin-top:10px;
  font-size:1rem;
  color:#555;
}

/* TIMER */
.timer{
  margin-top:20px;
  font-size:1.3rem;
  color:#e6a4b4;
  text-shadow:0 0 10px rgba(230,164,180,0.7);
}

/* SECTION */
.section{
  padding:40px 20px;
  text-align:center;
}

.card{
  background:#ffffffcc;
  padding:25px;
  border-radius:20px;
  border:1px solid rgba(230,164,180,0.3);
  box-shadow:0 5px 20px rgba(0,0,0,0.05);
  max-width:90%;
  margin:auto;
}

.card h2{
  color:#e6a4b4;
}

/* PETALS */
.petal{
  position:fixed;
  top:-10px;
  width:8px;
  height:8px;
  background:#f3c5cf;
  border-radius:50%;
  opacity:0.7;
  animation:fall linear infinite;
}

@keyframes fall{
  to{
    transform:translateY(100vh) translateX(30px);
  }
}

/* FOOTER */
footer{
  text-align:center;
  padding:25px;
  font-size:0.8rem;
  color:#999;
}
</style>
</head>

<body>

<!-- ENTRY -->
<div id="entryScreen">
  <h1>Alisha 💗 Rajinder</h1>
  <p>Ring Ceremony</p>
  <button class="enter-btn" onclick="enterSite()">💍 Save the Date</button>
</div>

<!-- MAIN -->
<div id="mainContent">

<div class="hero">
  <h1>Alisha 💗 Rajinder</h1>
  <p>18 April 2026 | 7 PM onwards</p>
  <div class="timer" id="countdown"></div>
</div>

<div class="section">
  <div class="card">
    <h2>Venue</h2>
    <p><b>Best Western Merrion</b></p>
    <p>Allure Banquet</p>
    <p>B Block, Ranjit Avenue, Amritsar</p>
    <a href="https://maps.app.goo.gl/VxLi1LGfHG9u6B4W6?g_st=aw" style="color:#e6a4b4;">View Map</a>
  </div>
</div>

<footer>
  Made with ❤️ for Alisha & Rajinder
</footer>

</div>

<!-- MUSIC -->
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
function enterSite(){
  document.getElementById("entryScreen").style.display="none";
  document.getElementById("mainContent").style.display="block";

  const music = document.getElementById("bgMusic");

  document.body.addEventListener("click", function playOnce(){
    music.play();
    document.body.removeEventListener("click", playOnce);
  });
}

// TIMER
const eventDate=new Date("April 18, 2026 19:00:00").getTime();

setInterval(()=>{
  const now=new Date().getTime();
  const gap=eventDate-now;

  const d=Math.floor(gap/(1000*60*60*24));
  const h=Math.floor((gap%(1000*60*60*24))/(1000*60*60));
  const m=Math.floor((gap%(1000*60*60))/(1000*60));
  const s=Math.floor((gap%(1000*60))/1000);

  document.getElementById("countdown").innerHTML=
  d+"d "+h+"h "+m+"m "+s+"s";
},1000);

// PETALS
setInterval(()=>{
  const petal=document.createElement("div");
  petal.className="petal";
  petal.style.left=Math.random()*100+"vw";
  petal.style.animationDuration=(Math.random()*4+2)+"s";
  document.body.appendChild(petal);
  setTimeout(()=>petal.remove(),5000);
},300);
</script>

</body>
</html>
