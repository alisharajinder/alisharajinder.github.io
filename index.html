<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alisha 💗 Rajinder</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  overflow-x:hidden;
}

/* CINEMATIC ENTRY */
#entryScreen{
  position:fixed;
  width:100%;
  height:100%;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
  color:white;
}

/* ZOOM BACKGROUND */
#entryScreen::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:url('bg.jpg') center/cover no-repeat;
  animation:zoomBg 8s ease forwards;
  z-index:-2;
}

/* DARK OVERLAY */
#entryScreen::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  z-index:-1;
}

@keyframes zoomBg{
  from{transform:scale(1);}
  to{transform:scale(1.2);}
}

/* TEXT */
.save-text{
  font-family:'Playfair Display';
  font-size:2.5rem;
  opacity:0;
  animation:fadeIn 3s ease forwards;
}

@keyframes fadeIn{
  0%{opacity:0;}
  100%{opacity:1;}
}

/* BUTTON */
.enter-btn{
  margin-top:20px;
  padding:12px 30px;
  border:none;
  border-radius:30px;
  background:#f3c5cf;
  color:black;
  opacity:0;
  animation:fadeIn 4s ease forwards;
}

/* MAIN */
#mainContent{
  display:none;
}

/* HERO */
.hero{
  height:100vh;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  color:white;
}

/* BG */
.hero::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:url('bg.jpg') center/cover no-repeat;
  z-index:-2;
}

.hero::after{
  content:"";
  position:absolute;
  bottom:0;
  width:100%;
  height:65%;
  background:url('bg.jpg') center/cover no-repeat;
  filter:blur(8px);
  z-index:-1;
  opacity:0.9;
}

/* TEXT */
.hero h1{
  font-family:'Playfair Display';
  font-size:2.5rem;
  color:#ffd1dc;
  text-shadow:0 0 20px pink;
}

/* TIMER */
.timer{
  margin-top:15px;
}

/* SCROLL BUTTON */
.scroll-down{
  position:absolute;
  bottom:80px;
  cursor:pointer;
}

.scroll-btn{
  width:45px;
  height:45px;
  border-radius:50%;
  background:pink;
  display:flex;
  justify-content:center;
  align-items:center;
  animation:bounce 1.5s infinite;
}

@keyframes bounce{
  50%{transform:translateY(10px);}
}

/* SECTION */
.section{
  padding:40px 20px;
  text-align:center;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.gallery img{
  width:100%;
  border-radius:15px;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
}
</style>
</head>

<body>

<!-- ENTRY -->
<div id="entryScreen">
  <div class="save-text">Save the Date</div>
  <button class="enter-btn" onclick="enterSite()">Enter</button>
</div>

<!-- MAIN -->
<div id="mainContent">

<div class="hero">
  <h1>Alisha 💗 Rajinder</h1>
  <p>18 April 2026 | 7 PM onwards</p>
  <div class="timer" id="countdown"></div>

  <div class="scroll-down" onclick="scrollToSection()">
    <div class="scroll-btn">↓</div>
  </div>
</div>

<div class="section" id="nextSection">
  <h2 style="color:#e6a4b4;">Our Moments 💗</h2>
  <div class="gallery">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
  </div>
</div>

<div class="section">
  <div class="card">
    <h2 style="color:#e6a4b4;">Venue</h2>
    <p><b>Best Western Merrion</b></p>
    <p>Allure Banquet</p>
    <p>B Block, Ranjit Avenue, Amritsar</p>
  </div>
</div>

<footer style="text-align:center;padding:20px;">
  Made with ❤️ for Alisha & Rajinder
</footer>

</div>

<audio id="bgMusic" loop>
  <source src="music.mp3">
</audio>

<script>
function enterSite(){
  document.getElementById("entryScreen").style.display="none";
  document.getElementById("mainContent").style.display="block";

  const music=document.getElementById("bgMusic");
  document.body.addEventListener("click",function playOnce(){
    music.play();
    document.body.removeEventListener("click",playOnce);
  });
}

function scrollToSection(){
  document.getElementById("nextSection").scrollIntoView({behavior:"smooth"});
}

const eventDate=new Date("April 18, 2026 19:00:00").getTime();
setInterval(()=>{
  const now=new Date().getTime();
  const gap=eventDate-now;

  const d=Math.floor(gap/(1000*60*60*24));
  const h=Math.floor((gap%(1000*60*60*24))/(1000*60*60));
  const m=Math.floor((gap%(1000*60*60))/(1000*60));
  const s=Math.floor((gap%(1000*60))/1000);

  document.getElementById("countdown").innerHTML=
  d+"d "+h+"h "+m+"m "+s+"s";
},1000);
</script>

</body>
</html>
