<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alisha 💗 Rajinder</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  overflow-x:hidden;
}

/* ================= ENTRY ================= */
#entryScreen{
  position:fixed;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:white;
  z-index:9999;
}

#entryScreen::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:url('bg.jpg') center/cover no-repeat;
  animation:zoomBg 8s ease forwards;
  z-index:-2;
}

#entryScreen::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  z-index:-1;
}

@keyframes zoomBg{
  to{transform:scale(1.2);}
}

.save-text{
  font-family:'Playfair Display';
  font-size:2.5rem;
  text-shadow:0 0 20px pink;
}

.enter-btn{
  margin-top:20px;
  padding:12px 30px;
  border:none;
  border-radius:30px;
  background:#ffc0cb;
}

/* ================= RING ================= */
#ringAnimation{
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9998;
}

.ring{
  width:80px;
  height:80px;
  border:5px solid gold;
  border-radius:50%;
  position:absolute;
  box-shadow:0 0 25px gold;
}

.ring-left{ left:30%; }
.ring-right{ right:30%; }

/* ================= MAIN ================= */
#mainContent{ display:none; }

.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  color:white;
  position:relative;
}

.hero::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:url('bg.jpg') center/cover no-repeat;
  z-index:-2;
}

.hero::after{
  content:"";
  position:absolute;
  bottom:0;
  width:100%;
  height:65%;
  background:url('bg.jpg') center/cover no-repeat;
  filter:blur(8px);
  z-index:-1;
}

.hero h1{
  font-family:'Playfair Display';
  color:#ffd1dc;
  text-shadow:0 0 20px pink;
}

/* SCROLL */
.scroll-down{
  position:absolute;
  bottom:90px;
  cursor:pointer;
}

.scroll-btn{
  width:50px;
  height:50px;
  border-radius:50%;
  background:pink;
  display:flex;
  justify-content:center;
  align-items:center;
  animation:bounce 1.5s infinite;
}

@keyframes bounce{
  50%{transform:translateY(10px);}
}

/* GALLERY */
.section{
  padding:50px 20px;
  text-align:center;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.gallery img{
  width:100%;
  border-radius:15px;
}

/* VENUE */
.venue-card{
  background:linear-gradient(135deg,#fff0f5,#ffe4ec);
  border-radius:25px;
  padding:30px;
  max-width:320px;
  margin:auto;
  position:relative;
  overflow:hidden;
}

.venue-glow{
  position:absolute;
  width:200%;
  height:200%;
  background:conic-gradient(transparent,pink,transparent);
  animation:rotate 6s linear infinite;
}

@keyframes rotate{
  100%{transform:rotate(360deg);}
}

.map-btn{
  margin-top:20px;
  display:inline-block;
  padding:12px 25px;
  border-radius:30px;
  background:linear-gradient(45deg,#ff9ecb,#ffc1da);
  color:white;
  text-decoration:none;
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
}

/* BUTTERFLY */
.butterfly{
  position:absolute;
  width:18px;
  height:18px;
  background:url('butterfly.png') center/contain no-repeat;
  animation:wing 0.2s infinite alternate;
  opacity:0.5;
}

@keyframes wing{
  from{transform:scaleX(1);}
  to{transform:scaleX(0.6);}
}
</style>
</head>

<body>

<!-- ENTRY -->
<div id="entryScreen">
  <div class="save-text">Save the Date</div>
  <button class="enter-btn" onclick="enterSite()">Enter</button>
</div>

<!-- RING -->
<div id="ringAnimation">
  <div class="ring ring-left"></div>
  <div class="ring ring-right"></div>
</div>

<!-- MAIN -->
<div id="mainContent">

<div class="hero" id="hero">
  <h1>Alisha 💗 Rajinder</h1>
  <p>18 April 2026 | 7 PM onwards</p>
  <div id="countdown"></div>

  <div class="scroll-down" onclick="scrollToSection()">
    <div class="scroll-btn">↓</div>
  </div>
</div>

<div class="section" id="nextSection">
  <h2 style="color:#e6a4b4;">Our Moments 💗</h2>
  <div class="gallery">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
  </div>
</div>

<div class="section">
  <h2 style="color:#e6a4b4;">Venue</h2>
  <div class="venue-card">
    <div class="venue-glow"></div>

    <h3>Best Western Merrion</h3>
    <p>Allure Banquet</p>
    <p>B Block, Ranjit Avenue, Amritsar</p>

    <a href="https://maps.app.goo.gl/VxLi1LGfHG9u6B4W6?g_st=aw" target="_blank" class="map-btn">
      🎢 Ride to Venue
    </a>
  </div>
</div>

<footer>Made with ❤️ for Alisha & Rajinder</footer>

</div>

<audio id="bgMusic" loop>
  <source src="music.mp3">
</audio>

<script>
function enterSite(){
  document.getElementById("entryScreen").style.display="none";

  const ring=document.getElementById("ringAnimation");
  ring.style.display="flex";

  document.querySelector(".ring-left").animate(
    [{transform:"translateX(0)"},{transform:"translateX(70px)"}],
    {duration:1500,fill:"forwards"}
  );

  document.querySelector(".ring-right").animate(
    [{transform:"translateX(0)"},{transform:"translateX(-70px)"}],
    {duration:1500,fill:"forwards"}
  );

  setTimeout(()=>{
    ring.style.background="radial-gradient(circle,gold,black)";
  },1500);

  setTimeout(()=>{
    ring.style.display="none";
    document.getElementById("mainContent").style.display="block";

    document.getElementById("bgMusic").play();

    generateButterflies();
  },2500);
}

function generateButterflies(){
  const hero=document.getElementById("hero");

  for(let i=0;i<40;i++){
    const b=document.createElement("div");
    b.className="butterfly";

    b.style.left=Math.random()*100+"%";
    b.style.top=Math.random()*100+"%";

    b.animate([
      {transform:"translate(0,0)"},
      {transform:"translate(80px,-80px)"},
      {transform:"translate(150px,150px)"}
    ],{
      duration:4000+Math.random()*2000,
      iterations:Infinity
    });

    hero.appendChild(b);
  }
}

function scrollToSection(){
  document.getElementById("nextSection").scrollIntoView({behavior:"smooth"});
}

const eventDate=new Date("April 18, 2026 19:00:00").getTime();

setInterval(()=>{
  const now=new Date().getTime();
  const gap=eventDate-now;

  const d=Math.floor(gap/(1000*60*60*24));
  const h=Math.floor((gap%(1000*60*60*24))/(1000*60*60));
  const m=Math.floor((gap%(1000*60*60))/(1000*60));
  const s=Math.floor((gap%(1000*60))/1000);

  document.getElementById("countdown").innerHTML=
  d+"d "+h+"h "+m+"m "+s+"s";
},1000);
</script>

</body>
</html>
